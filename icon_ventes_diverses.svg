<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d2137"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Shopping cart body -->
  <path d="M8 14 L14 14 L20 38 L50 38 L54 22 L18 22" fill="none" stroke="url(#cart)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Cart items -->
  <rect x="24" y="26" width="6" height="8" rx="1" fill="#34d399" opacity="0.8"/>
  <rect x="33" y="26" width="6" height="8" rx="1" fill="#f59e0b" opacity="0.8"/>
  <rect x="42" y="26" width="6" height="8" rx="1" fill="#f87171" opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="24" cy="44" r="4" fill="none" stroke="url(#cart)" stroke-width="2"/>
  <circle cx="44" cy="44" r="4" fill="none" stroke="url(#cart)" stroke-width="2"/>
  <!-- Price tag -->
  <circle cx="50" cy="16" r="7" fill="#f59e0b"/>
  <text x="50" y="19" text-anchor="middle" font-family="Arial" font-size="8" fill="#0a0e18" font-weight="bold">DA</text>
</svg>