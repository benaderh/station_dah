<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Station building -->
  <rect x="10" y="28" width="30" height="22" rx="2" fill="url(#accent)"/>
  <rect x="13" y="33" width="8" height="8" rx="1" fill="#0a0e18" opacity="0.6"/>
  <rect x="25" y="33" width="8" height="8" rx="1" fill="#0a0e18" opacity="0.6"/>
  <rect x="18" y="41" width="10" height="9" rx="1" fill="#0a0e18" opacity="0.5"/>
  <!-- Roof -->
  <polygon points="6,28 44,28 40,20 10,20" fill="#22d3ee"/>
  <!-- Fuel pump -->
  <rect x="46" y="24" width="10" height="26" rx="2" fill="#2563eb"/>
  <rect x="48" y="27" width="6" height="8" rx="1" fill="#60a5fa"/>
  <line x1="46" y1="38" x2="42" y2="44" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="42" cy="45" r="2" fill="#f59e0b"/>
  <!-- Ground line -->
  <rect x="6" y="50" width="52" height="2" rx="1" fill="#1f2937"/>
</svg>