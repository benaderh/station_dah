<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0e18"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Person body -->
  <circle cx="32" cy="20" r="9" fill="url(#gold)"/>
  <ellipse cx="32" cy="46" rx="15" ry="10" fill="#1f2937"/>
  <ellipse cx="32" cy="40" rx="12" ry="9" fill="url(#gold)" opacity="0.9"/>
  <!-- Crown -->
  <polygon points="20,15 24,8 28,14 32,6 36,14 40,8 44,15" fill="#f59e0b" stroke="#d97706" stroke-width="0.5"/>
  <!-- Collar/tie -->
  <rect x="29" y="40" width="6" height="12" rx="1" fill="#2563eb"/>
  <polygon points="32,38 29,42 35,42" fill="#1d4ed8"/>
</svg>