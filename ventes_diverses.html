<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Station Pro — Ventes Diverses</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0a0e18">
<style>
 :root{--bg:#0a0e18;--card:#111827;--line:#1f2937;--muted:#8b95a7;--accent:#2563eb;--ok:#34d399;--red:#f87171;--warn:#fbbf24}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:#e5e9f0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px;max-width:520px;margin:0 auto}
 h1{font-size:18px;margin:0 0 2px}
 h2{font-size:14px;margin:0 0 10px}
 .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
 label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;margin-top:12px}
 label:first-child{margin-top:0}
 select,input{width:100%;background:#0d1424;border:1px solid var(--line);color:#e5e9f0;border-radius:10px;padding:12px;font-size:16px}
 input:disabled{opacity:.6}
 button{width:100%;background:var(--accent);color:#fff;border:none;border-radius:12px;padding:15px;font-size:15px;font-weight:700;margin-top:16px}
 button:disabled{opacity:.4}
 button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;margin-top:8px}
 .btn{width:100%;background:var(--line);color:#e5e9f0;border:none;border-radius:12px;padding:12px;font-size:15px;font-weight:700;margin-top:10px}
 .btn.accent{background:var(--accent);color:#fff}
 .msg{border-radius:10px;padding:12px;font-size:14px;margin-bottom:14px;display:none}
 .msg.ok{background:#0f2e22;border:1px solid #15532d;color:#6ee7b7;display:block}
 .msg.err{background:#3b1717;border:1px solid #7f1d1d;color:#fca5a5;display:block}
 .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
 .readonly{background:#0a0f1c;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--muted)}
 table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
 td,th{padding:6px 2px;border-bottom:1px solid var(--line);text-align:left}
 th{color:var(--muted);font-size:11px;text-transform:uppercase}
 .num{text-align:right}
</style>
</head>
<body>
<h1>🛒 المبيعات المتنوعة (Ventes Diverses)</h1>
<div class="sub" id="subHead">Connexion…</div>
<div id="msg" class="msg"></div>

<div id="loginBox" class="card" style="display:none">
 <label>Email</label><input id="email" type="email" autocomplete="username">
 <label>Mot de passe</label><input id="password" type="password" autocomplete="current-password">
 <button onclick="doLogin()">Se connecter</button>
</div>

<div id="appBox" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
const SUPABASE_URL="https://twxpixyjuacreatxncfo.supabase.co";
const SUPABASE_KEY="sb_publishable_VdDiO_xSqIvBbWak_wPASw__zsfWGby";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
function showMsg(t,type){const m=$("msg");m.textContent=t;m.className="msg "+type;if(type==="ok")setTimeout(()=>{m.className="msg";},4000);}

const fmt=n=>Math.round(Number(n)||0).toLocaleString("fr-FR");
const fmtQ=n=>Number(n||0).toLocaleString("fr-FR",{maximumFractionDigits:2});
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function frDate(iso){if(!iso)return"—";const p=iso.split("-");return p[2]+"/"+p[1]+"/"+p[0];}

let DB={indexs:[],tiers:[],articles:[],agent_detail:[],mouv_detail:[]};
let profile=null,myTier=null,today=null,myRole="permanent";

async function doLogin(){
 const email=$("email").value.trim(),password=$("password").value;
 if(!email||!password){showMsg("Email et mot de passe requis.","err");return;}
 const{error}=await sb.auth.signInWithPassword({email,password});
 if(error){showMsg("Connexion refusée : "+error.message,"err");return;}
 await afterLogin();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

async function afterLogin(){
 const{data:{user}}=await sb.auth.getUser();
 if(!user){$("loginBox").style.display="block";$("subHead").textContent="Connecte-toi pour continuer.";return;}
 const{data:prof,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 if(error||!prof||!['divers','admin','patron'].includes(prof.role)){
  showMsg("Erreur : Ce compte n'est pas autorisé sur cette page. (Rôle attendu : divers)","err");
  await sb.auth.signOut();$("loginBox").style.display="block";return;}
 profile=prof;
 $("loginBox").style.display="none";
 $("appBox").style.display="block";
 await loadContext();
}

function datesDesc(){return[...new Set(DB.indexs.map(r=>r.index_date))].sort().reverse();}

async function loadContext(){
 $("subHead").textContent="Chargement…";
 try{
  for(const t of["indexs","tiers","articles","agent_detail","mouv_detail"]){
   const{data,error}=await sb.from(t).select("data");
   if(error)throw error;
   DB[t]=(data||[]).map(r=>r.data);
  }
  const {data: pendData, error: pendErr} = await sb.from("releve_pending").select("*");
  if(pendErr) throw pendErr;
  window.pendingSales = pendData || [];
  
  myTier=DB.tiers.find(x=>x.nom === 'Clients divers' || String(x.tier_id) === '24');
  
  const ds=datesDesc();
  today=ds[0]||null;
  if(!today){$("appBox").innerHTML=`<div class="card">Aucune journée ouverte pour l'instant.</div>`;$("subHead").textContent=myTier?esc(myTier.nom):"";return;}
  
  window.myExtraSales = 0;
  window.myExtraSalesList = [];
  if(myTier) {
   window.pendingSales.forEach(r => {
    if(r.pistolet.startsWith("V_ART_")) {
     const art_id = r.pistolet.split("_")[2];
     const a = DB.articles.find(x=>String(x.art_id)===String(art_id));
     if(a) {
      a.qs_vitrine = (Number(a.qs_vitrine)||0) - Number(r.valeur);
      if(r.rec_date === today && Number(r.ord) === Number(myTier.ord)) {
       const mt = Number(r.valeur) * Number(a.pv);
       window.myExtraSales += mt;
       window.myExtraSalesList.push({ type_a: a.type_a, article: a.article, qte: Number(r.valeur), prix: Number(a.pv), mt: mt, status: '⏳' });
      }
     }
    }
   });
   
   const myValSales = DB.mouv_detail.filter(m => m.date_m === today && String(m.tier_id) === String(myTier.tier_id) && m.mouvement_id === 0);
   myValSales.forEach(m => {
    const mt = Number(m.total)||0;
    window.myExtraSales += mt;
    const a = DB.articles.find(x=>String(x.art_id)===String(m.art_id));
    window.myExtraSalesList.push({ type_a: a ? a.type_a : null, article: a ? a.article : "Article inconnu", qte: Number(m.qte), prix: Number(m.pv), mt: mt, status: '✅' });
   });
  }

  $("subHead").textContent=(myTier?esc(myTier.nom):"Ventes Diverses")+" · "+frDate(today);
  renderApp();
 }catch(e){
  console.error(e);
  $("appBox").innerHTML=`<div class="card">Erreur de chargement : ${esc(e.message)}</div>`;
 }
}

function renderApp(){
 if(!myTier){
  $("appBox").innerHTML=`<div class="card"><h2>⚠️ Agent introuvable</h2><p class="sub" style="margin:0">L'agent 'Clients divers' n'a pas été trouvé dans la base de données.</p></div>${logoutBtn()}`;
  return;
 }
 $("appBox").innerHTML=`
  <div id="bilanContainer">${bilanCard()}</div>
  ${renderGaz()}
  ${renderLub()}
  ${logoutBtn()}`;
 refreshCompute();
}

function bilanCard(){
 if(!myTier)return"";
 const versements=DB.agent_detail.filter(a=>String(a.id_agent)===String(myTier.tier_id)&&a.date_agent===today);
 const totalVers=versements.reduce((s,a)=>s+Number(a.mt_agent||0),0);
 
 const salesHtml = (window.myExtraSalesList && window.myExtraSalesList.length) ?
  `<div style="margin-bottom:12px">
    <h3 style="font-size:13px;margin:0 0 6px 0;color:var(--accent)">🛒 بيع الزيوت و الغاز</h3>
    <table><tr><th>العنصر</th><th class="num">الكمية</th><th class="num">السعر</th><th class="num">المبلغ</th></tr>
    ${window.myExtraSalesList.map(s => `<tr><td>${s.status} ${esc(s.article)}</td><td class="num">${s.qte}</td><td class="num">${fmt(s.prix)}</td><td class="num">${fmt(s.mt)} DA</td></tr>`).join("")}
    <tr style="font-weight:700"><td>المجموع</td><td></td><td></td><td class="num">${fmt(window.myExtraSales)} DA</td></tr>
    </table>
   </div>` : '';

 return`<div class="card">
  ${salesHtml}
  <h3 style="font-size:13px;margin:0 0 6px 0;color:var(--warn)">💸 Versements</h3>
  ${versements.length?`<table><tr><th>Versement</th><th class="num">Montant</th></tr>
   ${versements.map(m=>`<tr><td>${esc(m.obs_agent||"Avance")}</td><td class="num">${fmt(m.mt_agent)} DA</td></tr>`).join("")}
   </table>`:`<p class="sub" style="margin:0 0 12px 0">Aucun versement enregistré aujourd'hui.</p>`}
  <table style="margin-top:12px;border-top:1px solid var(--line);padding-top:6px">
   <tr><td>الزيوت</td><td class="num" id="bilanLubrifiants">0 DA</td></tr>
   <tr><td>الغاز</td><td class="num" id="bilanGaz">0 DA</td></tr>
   <tr><td style="font-weight:bold">المجموع</td><td class="num" style="font-weight:bold" id="bilanVentes">0 DA</td></tr>
   <tr><td>التسبيقات</td><td class="num">${fmt(totalVers)} DA</td></tr>
   <tr style="font-weight:700;color:var(--ok)"><td>الباقي</td><td class="num" id="bilanReste">—</td></tr>
  </table>
 </div>`;
}

function refreshCompute(){
 let totalGaz = 0, totalLub = 0;
 if(window.myExtraSalesList) {
  window.myExtraSalesList.forEach(s => {
   if(Number(s.type_a) === 9) totalGaz += s.mt;
   else totalLub += s.mt;
  });
 }
 const totalVentes = (window.myExtraSales || 0);
 
 const bv=$("bilanVentes");
 if(bv){
  bv.textContent=fmt(totalVentes)+" DA";
  const bg=$("bilanGaz"); if(bg) bg.textContent=fmt(totalGaz)+" DA";
  const bl=$("bilanLubrifiants"); if(bl) bl.textContent=fmt(totalLub)+" DA";
  const versements=DB.agent_detail.filter(a=>String(a.id_agent)===String((myTier||{}).tier_id)&&a.date_agent===today);
  const totalVers=versements.reduce((s,a)=>s+Number(a.mt_agent||0),0);
  $("bilanReste").textContent=fmt(totalVentes-totalVers)+" DA";
 }
}

function renderGaz(){
 const g = DB.articles.find(a=>Number(a.type_a)===9);
 if(!g) return "";
 return `<div class="card">
  <h2>🔥 Gaz Butane</h2>
  <div style="font-weight:bold;margin-bottom:6px">${esc(g.article)}</div>
  <div class="row2">
   <div>Stock: <b>${fmtQ(g.qs_vitrine||0)}</b></div>
   <div>Prix: <b>${fmt(g.pv)} DA</b></div>
  </div>
  <div class="row2" style="margin-top:10px;align-items:center">
   <div style="display:flex;gap:4px">
    <button class="btn" style="margin:0;padding:8px" onclick="adjQte('gazQte',-1,${g.pv})">-</button>
    <input id="gazQte" type="number" value="1" style="text-align:center;padding:8px;width:100%" oninput="calcGazMt(${g.pv})" onfocus="this.select()">
    <button class="btn" style="margin:0;padding:8px" onclick="adjQte('gazQte',1,${g.pv})">+</button>
   </div>
   <div style="text-align:right">Mt: <b id="gazMt" style="color:var(--accent)">${fmt(g.pv)} DA</b></div>
  </div>
  <button class="btn accent" style="width:100%;margin-top:10px" ondblclick="sendVente(${g.art_id}, 'gazQte', ${g.pv})">Ok (Double-clic)</button>
 </div>`;
}

let html5QrcodeScanner = null;
function renderLub(){
 return `<div class="card">
  <h2>🛢️ Lubrifiants</h2>
  <button id="startCamBtn" class="btn" style="width:100%;margin-bottom:10px" onclick="startScanner()">📸 Scanner Code-barre</button>
  <div id="reader" style="width:100%;margin-bottom:10px;display:none;background:#fff;border-radius:8px;overflow:hidden"></div>
  <button id="cancelCamBtn" class="btn ghost" style="width:100%;margin-bottom:10px;display:none" onclick="stopScanner()">Annuler (fermer caméra)</button>
  <div id="lubResult" style="display:none;border:1px solid var(--line);padding:10px;border-radius:6px">
   <div id="lubName" style="font-weight:bold;color:var(--accent);margin-bottom:6px"></div>
   <div class="row2">
    <div>Stock: <b id="lubStock"></b></div>
    <div>Prix: <b id="lubPrix"></b> DA</div>
   </div>
   <div class="row2" style="margin-top:10px;align-items:center">
    <div style="display:flex;gap:4px">
     <button class="btn" style="margin:0;padding:8px" onclick="adjQte('lubQte',-1,0)">-</button>
     <input id="lubQte" type="number" value="1" style="text-align:center;padding:8px;width:100%" oninput="calcLubMt()" onfocus="this.select()">
     <button class="btn" style="margin:0;padding:8px" onclick="adjQte('lubQte',1,0)">+</button>
    </div>
    <div style="text-align:right">Mt: <b id="lubMt" style="color:var(--accent)"></b> DA</div>
   </div>
   <button class="btn accent" style="width:100%;margin-top:10px" id="lubOkBtn">Ok (Double-clic)</button>
   <button class="btn ghost" style="width:100%;margin-top:10px" onclick="cancelLubSale()">Annuler</button>
  </div>
 </div>`;
}

function stopScanner() {
 if(html5QrcodeScanner) {
  html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }).catch(e=>console.log(e));
 }
 $("reader").style.display = "none";
 if($("cancelCamBtn")) $("cancelCamBtn").style.display = "none";
 if($("startCamBtn")) $("startCamBtn").style.display = "block";
}

function cancelLubSale() {
 $("lubResult").style.display = "none";
 $("lubQte").value = 1;
}

function startScanner() {
 $("lubResult").style.display = "none";
 $("reader").style.display = "block";
 if($("cancelCamBtn")) $("cancelCamBtn").style.display = "block";
 if($("startCamBtn")) $("startCamBtn").style.display = "none";
 if(!html5QrcodeScanner) {
  html5QrcodeScanner = new Html5Qrcode("reader");
 }
 html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: {width: 250, height: 250} }, onScanSuccess, onScanFailure).catch(e=>showMsg("Caméra indisponible : "+e.message, "err"));
}
function onScanSuccess(decodedText, decodedResult) {
 const a = DB.articles.find(x => x.code_barre === decodedText && Number(x.type_a) === 0);
 if(a) {
  if(html5QrcodeScanner){
   html5QrcodeScanner.stop().then(() => { html5QrcodeScanner.clear(); html5QrcodeScanner = null; }).catch(e=>console.log(e));
  }
  $("reader").style.display = "none";
  if($("cancelCamBtn")) $("cancelCamBtn").style.display = "none";
  if($("startCamBtn")) $("startCamBtn").style.display = "block";
  $("lubResult").style.display = "block";
  $("lubName").textContent = a.article;
  $("lubStock").textContent = fmtQ(a.qs_vitrine||0) + " " + (a.unite||"");
  $("lubPrix").textContent = fmt(a.pv);
  $("lubQte").value = 1;
  $("lubQte").dataset.art = a.art_id;
  $("lubQte").dataset.pv = a.pv;
  calcLubMt();
  $("lubOkBtn").ondblclick = () => sendVente(a.art_id, 'lubQte', a.pv);
 } else {
  showMsg("Article introuvable pour ce code-barre.", "err");
 }
}
function onScanFailure(error) {}

function adjQte(id, d, pv){
 const el = $(id);
 let v = (Number(el.value)||0) + d;
 if(v<1) v=1;
 el.value = v;
 if(id==='gazQte') calcGazMt(pv);
 else calcLubMt();
}
function calcGazMt(pv){
 const qte = Number($('gazQte').value)||0;
 $('gazMt').textContent = fmt(qte * pv) + " DA";
}
function calcLubMt(){
 const el = $('lubQte');
 const qte = Number(el.value)||0;
 const pv = Number(el.dataset.pv)||0;
 $('lubMt').textContent = fmt(qte * pv) + " DA";
}
async function sendVente(art_id, qteInputId, pv){
 const qte = Number($(qteInputId).value)||0;
 if(qte <= 0) return;
 const a = DB.articles.find(x => String(x.art_id) === String(art_id));
 if(!a) return;
 const id = today + "_" + (new Date().getTime()) + "_V_" + art_id;
 const row = {
  id: id,
  rec_date: today,
  pistolet: "V_ART_"+art_id,
  role: myRole,
  ord: Number(myTier.ord),
  valeur: qte
 };
 try {
  const {error} = await sb.from("releve_pending").upsert([row]);
  if(error) throw error;
  showMsg("✓ Vente envoyée : " + qte + "x " + a.article, "ok");
  
  // Mise à jour locale (visuelle)
  a.qs_vitrine = (Number(a.qs_vitrine)||0) - qte;
  const mt = qte * Number(a.pv);
  window.myExtraSales = (window.myExtraSales || 0) + mt;
  if(!window.myExtraSalesList) window.myExtraSalesList = [];
  window.myExtraSalesList.push({ type_a: a.type_a, article: a.article, qte: qte, prix: a.pv, mt: mt, status: '⏳' });
  
  if($("bilanContainer")) {
   $("bilanContainer").innerHTML = bilanCard();
  }
  refreshCompute();
  
  $(qteInputId).value = 1;
  if(qteInputId==='gazQte') {
   calcGazMt(a.pv);
   renderGaz(); // Rafraîchit l'affichage du stock gaz
  } else { 
   $("lubResult").style.display="none"; 
  }
 } catch(e) {
  showMsg("Erreur d'envoi : " + e.message, "err");
 }
}

function logoutBtn(){return`<button class="ghost" onclick="doLogout()">Se déconnecter</button>`;}

/* ====== Démarrage ====== */
(async function start(){
 const{data:{session}}=await sb.auth.getSession();
 if(session){await afterLogin();}
 else{$("loginBox").style.display="block";$("subHead").textContent="Connecte-toi pour continuer.";}
})();
</script>
</body>
</html>
